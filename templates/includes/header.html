<div class="d-flex justify-content-between align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <!-- Левая часть -->
    <nav class="d-flex">
        {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-primary me-2" href="{% url 'home:home' %}">Главная</a>
        <a class="p-2 btn btn-outline-primary me-2" href="{% url 'mailing:list' %}">Рассылки</a>
        <a class="p-2 btn btn-outline-primary me-2" href="{% url 'home:contacts' %}">Контакты</a>
        {% else %}
        <a class="p-2 btn btn-outline-primary me-2" href="{% url 'home:home' %}">Главная</a>
        <a class="p-2 btn btn-outline-primary me-2" href="{% url 'home:contacts' %}">Контакты</a>
        {% endif %}
    </nav>

    <!-- Центральная часть -->
    <div class="text-center mx-3">
        <h5 class="my-0 font-weight-normal">SkyMailing</h5>
    </div>

    <!-- Правая часть -->
    <nav class="d-flex">
        {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-secondary me-2" href="{% url 'users:profile' %}">Профиль</a>
        <form method="post" action="{% url 'users:logout' %}" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="p-2 btn btn-outline-danger">Выйти</button>
        </form>
        {% else %}
        <a class="p-2 btn btn-outline-success me-2" href="{% url 'users:login' %}">Войти</a>
        <a class="p-2 btn btn-success" href="{% url 'users:register' %}">Регистрация</a>
        {% endif %}
    </nav>
</div>
